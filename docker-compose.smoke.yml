# Smoke run with the real judge on made-up local pages only: docker compose -f docker-compose.yml -f docker-compose.smoke.yml ...
# (needs your own Anthropic and Web Risk keys; costs a few cents.) Same local fixture pages and proxy TEST profile as docker-compose.test.yml (so the proxy can reach the made-up local pages and nothing else),
# but the API runs with the REAL judge and Web Risk: LLMURL_TEST_MODE stays unset. The run cap comes from LLMURL_RUN_CAP_USD / LLMURL_RUN_START.
# Never use this file for real addresses: the allowlist holds the fixture only.
networks:
  fixture-net:
    internal: true
    ipam: {config: [{subnet: 10.80.5.0/24}]}

services:
  fixtures:
    image: llm-url-scan-api:local
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "/fixture/fixtures.py"]
    volumes: ["./tests/stack/fixtures.py:/fixture/fixtures.py:ro"]
    networks:
      fixture-net: {ipv4_address: 10.80.5.10, aliases: [fx.example, refused.example]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8080/ok', timeout=3).status==200 else 1)"]
      interval: 3s
      timeout: 4s
      retries: 20

  proxy:
    command: ["node", "/app/egress-proxy.mjs", "--test-profile"]
    environment:
      EGRESS_PROFILE: test
      EGRESS_ALLOWLIST_FILE: /allow.json
      EGRESS_BLOCK_EXTRA_CIDRS: "10.80.0.0/16"
    volumes: ["./tests/stack/allowlist.json:/allow.json:ro"]
    networks:
      fixture-net: {ipv4_address: 10.80.5.2}
    depends_on:
      fixtures: {condition: service_healthy}

  capture:
    environment:
      CAPTURE_PAGE_TIMEOUT_MS: "4000"
      CAPTURE_WAIT_MS: "300"
